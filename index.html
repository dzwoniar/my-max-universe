<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mój Mały Wszechświat</title>
<meta name="description" content="Gra o budowaniu własnej planety. Zbieraj surowce, odblokowuj ziemię, leć dalej.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<style>
/* ============================================================
   STYLE — czyli jak to wygląda
   ============================================================
   Sama gra rysuje się na <canvas>. Wszystko inne (liczniki, przyciski,
   panel ulepszeń) to zwykły HTML położony NA wierzchu. Tak jest o wiele
   łatwiej niż rysować przyciski w canvasie — dostajesz za darmo
   klikanie, zawijanie tekstu i działanie na każdym ekranie.
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

:root {
  --panel: rgba(12, 18, 30, 0.82);
  --ramka: rgba(255, 255, 255, 0.14);
  --zloto: #f2c14e;
  --tekst: #eef3fa;
}

html, body {
  height: 100%;
  overflow: hidden;                 /* gra nigdy się nie przewija */
  background: #060b14;
  color: var(--tekst);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Bez tego dwuklik na telefonie zoomuje planszę zamiast grać. */
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#plotno { display: block; width: 100vw; height: 100vh; }

/* --- warstwa HUD ------------------------------------------- */
.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;             /* klikamy "przez" HUD... */
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
           max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.hud button, .hud #dzojstik, .hud #sklep { pointer-events: auto; }  /* ...poza tym */

.gora-lewo  { position: absolute; top: 12px; left: 12px; }
.gora-prawo { position: absolute; top: 12px; right: 12px; text-align: right; }
.dol-lewo   { position: absolute; bottom: 14px; left: 12px; }

/* --- liczniki surowców -------------------------------------- */
#zasoby { display: flex; flex-wrap: wrap; gap: 6px; max-width: 60vw; }


.zasob {
  display: flex; align-items: center; gap: 6px;
  background: var(--panel);
  border: 1px solid var(--ramka);
  border-radius: 999px;
  padding: 5px 12px 5px 8px;
  font-variant-numeric: tabular-nums;   /* cyfry nie skaczą przy zmianie */
  font-weight: 700;
  font-size: 15px;
  transition: transform .12s, background .2s;
}
.zasob .ikona { font-size: 17px; }
.zasob.blysk {
  background: rgba(242, 193, 78, 0.28);
  transform: scale(1.12);
}

/* --- planeta + ikonki --------------------------------------- */
.planeta {
  background: var(--panel);
  border: 1px solid var(--ramka);
  border-radius: 12px;
  padding: 7px 12px;
  line-height: 1.35;
  font-size: 14px;
}
.planeta b { display: block; font-size: 15px; }
.planeta span { opacity: .72; font-size: 12px; }

.ikonki { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.ikonki button {
  width: 42px; height: 42px;
  font-size: 19px;
  background: var(--panel);
  border: 1px solid var(--ramka);
  border-radius: 12px;
  color: var(--tekst);
  cursor: pointer;
}
.ikonki button:active { transform: scale(.92); }

/* --- podpowiedź --------------------------------------------- */
#podpowiedz {
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--ramka);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Na wąskim ekranie podpowiedź wchodziłaby na liczniki — spychamy ją na dół. */
@media (max-width: 780px) {
  #podpowiedz {
    top: auto; bottom: 88px;
    font-size: 13px;
    /* Jedna linijka z wielokropkiem ucina najważniejsze słowo zdania.
       Na wąskim ekranie wolimy dwie linijki niż "podejdź do drz...". */
    white-space: normal;
    text-align: center;
    max-width: calc(100vw - 32px);
  }
}

/* --- pasek życia -------------------------------------------- */
.zycie {
  width: 168px; height: 14px;
  background: rgba(0, 0, 0, .55);
  border: 1px solid var(--ramka);
  border-radius: 999px;
  overflow: hidden;
}
#zycie-pasek {
  height: 100%;
  width: 100%;
  background: #5ad46f;              /* kolor nadpisuje JS zależnie od HP */
  transition: width .15s, background .25s;
}

/* --- przycisk "odblokuj ziemię" ----------------------------- */
#przycisk-kup {
  position: absolute;
  bottom: 26px; left: 50%;
  transform: translateX(-50%);
  padding: 14px 26px;
  font-size: 17px;
  font-weight: 800;
  color: #23180a;
  background: linear-gradient(180deg, #ffd970, var(--zloto));
  border: none;
  border-radius: 14px;
  box-shadow: 0 6px 0 #b58a25, 0 10px 22px rgba(0, 0, 0, .45);
  cursor: pointer;
  /* Pulsowanie przyciąga wzrok, ale animujemy TYLKO poświatę, nie rozmiar.
     Przycisk zmieniający wielkość to ruchomy cel — wredne dla kogoś,
     kto dopiero uczy się celować myszką. */
  animation: puls 1.2s ease-in-out infinite;
}
#przycisk-kup:disabled {
  background: rgba(70, 80, 95, .92);
  color: rgba(255, 255, 255, .62);
  box-shadow: none;
  animation: none;
  cursor: default;
}
#przycisk-kup:not(:disabled):active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #b58a25; }
@keyframes puls {
  50% { box-shadow: 0 6px 0 #b58a25, 0 0 0 10px rgba(242, 193, 78, .22), 0 10px 22px rgba(0, 0, 0, .45); }
}

/* --- gałka (dotyk) ------------------------------------------ */
#dzojstik {
  position: absolute;
  right: 26px; bottom: 26px;
  width: 128px; height: 128px;
  border-radius: 50%;
  /* Gałka musi być WYRAŹNIE widoczna. Ładna, ledwo majacząca poświata
     wygląda świetnie na zrzucie ekranu i fatalnie na słońcu — a to jest
     jedyny sposób sterowania na telefonie. */
  background: rgba(10, 16, 28, .55);
  border: 3px solid rgba(255, 255, 255, .45);
  box-shadow: 0 4px 18px rgba(0, 0, 0, .5);
  display: none;
  place-items: center;
}
#galka {
  width: 58px; height: 58px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .8);
  border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
}
#dzojstik.aktywny { background: rgba(30, 45, 70, .7); }

/* Klasę `dotyk` nadaje JS (patrz js/wejscie.js) — na telefonie i tablecie,
   a nie na laptopie z myszką. Na dotyku gałka zajmuje prawy dolny róg,
   więc przycisk "Odblokuj" musi się przesunąć w lewo, żeby nie wpaść
   pod kciuk sterujący bohaterem. */
body.dotyk #dzojstik { display: grid; }
/* Gałka zajmuje dolny pas ekranu — podpowiedź musi wylądować nad nią,
   inaczej połowa zdania chowa się pod kciukiem. */
body.dotyk #podpowiedz { bottom: 172px; }
body.dotyk #przycisk-kup { left: 20px; transform: none; bottom: 34px; }
body.dotyk #przycisk-kup:not(:disabled):active { transform: translateY(4px); }

/* --- sklep --------------------------------------------------- */
#sklep {
  position: absolute;
  /* Musi zaczynać się PONIŻEJ rzędu ikonek, bo inaczej przykrywa własny
     przycisk otwierania — i nie da się go już zamknąć. */
  top: 132px; right: 12px;
  width: min(320px, calc(100vw - 24px));
  background: var(--panel);
  backdrop-filter: blur(6px);
  border: 1px solid var(--ramka);
  border-radius: 16px;
  padding: 14px;
}
#sklep h2 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
#zamknij-sklep {
  width: 30px; height: 30px;
  font-size: 14px;
  background: rgba(255, 255, 255, .1);
  border: none; border-radius: 8px;
  color: var(--tekst);
  cursor: pointer;
}
.sklep-stopka { margin-top: 10px; font-size: 12px; opacity: .62; line-height: 1.5; }

.ulepszenie {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  border-top: 1px solid rgba(255, 255, 255, .08);
}
.ulepszenie:first-child { border-top: none; }
.u-ikona { font-size: 24px; }
.u-opis { display: flex; flex-direction: column; flex: 1; line-height: 1.3; }
.u-opis b { font-size: 14px; }
.u-poziom { font-size: 12px; color: var(--zloto); }
.u-moc { font-size: 11px; opacity: .6; }

.ulepszenie button {
  min-width: 78px;
  padding: 9px 10px;
  font-size: 13px;
  font-weight: 700;
  color: #23180a;
  background: var(--zloto);
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
.ulepszenie button:disabled { background: rgba(255, 255, 255, .13); color: rgba(255, 255, 255, .45); cursor: default; }

/* --- ekran startowy / portal --------------------------------- */
#ekran {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: rgba(4, 8, 16, .8);
  backdrop-filter: blur(4px);
  z-index: 10;
  padding: 20px;
}
.okno {
  max-width: 520px;
  text-align: center;
  background: #101a2b;
  border: 1px solid var(--ramka);
  border-radius: 20px;
  padding: 30px 26px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
}
.okno h1 { font-size: 26px; margin-bottom: 12px; }
.okno p { font-size: 15px; line-height: 1.65; opacity: .88; margin-bottom: 22px; }
/* Trzy krótkie linijki z ikoną zamiast akapitu. Pięciolatek nie przeczyta
   akapitu, ale ikonę i cztery słowa ogarnie — albo ogarnie za niego rodzic
   w dwie sekundy zamiast w trzydzieści. */
.okno .jak { display: block; margin: 6px 0; font-size: 15px; }
/* Celujemy w KONKRETNY przycisk, nie w "każdy button w oknie". Ta reguła
   obejmowała też przyciski wyboru trudności i — przez wyższą specyficzność
   niż `.trudnosc` — malowała je wszystkie na złoto. Wychodziło dokładnie
   na odwrót: niewybrane poziomy świeciły, a wybrany wyglądał na wyłączony. */
#ekran-dalej {
  padding: 14px 40px;
  font-size: 18px;
  font-weight: 800;
  color: #23180a;
  background: linear-gradient(180deg, #ffd970, var(--zloto));
  border: none;
  border-radius: 14px;
  box-shadow: 0 6px 0 #b58a25;
  cursor: pointer;
}
#ekran-dalej:active { transform: translateY(4px); box-shadow: 0 2px 0 #b58a25; }
.okno small { display: block; margin-top: 16px; font-size: 12px; opacity: .5; }

/* --- wybór poziomu trudności -------------------------------- */
#wybor-trudnosci { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; }
.trudnosc {
  flex: 1;
  max-width: 130px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--tekst);
  background: rgba(255, 255, 255, .07);
  border: 2px solid transparent;
  border-radius: 14px;
  cursor: pointer;
}
.trudnosc .t-ikona { font-size: 30px; line-height: 1; }
/* Wybrany poziom musi być widoczny bez czytania — stąd i ramka, i tło.
   Sam kolor tekstu odpadał: dzieciak nie porównuje odcieni szarości. */
.trudnosc.wybrany { border-color: var(--zloto); background: rgba(242, 193, 78, .18); }

/* ============================================================
   MAŁE EKRANY — na końcu pliku!
   Przy równej "sile" selektorów CSS wygrywa ten NIŻEJ w pliku.
   Ten blok stał kiedyś wyżej i po cichu nie działał: telefon czytał
   go poprawnie, a dwie linijki dalej reguła bazowa nadpisywała go
   z powrotem. Klasyczna pułapka.
   ============================================================ */
/* Na wąskim ekranie cztery liczniki muszą zmieścić się w jednym rzędzie,
   inaczej zawijają się pod nazwę planety i robi się kotłowanina. */
@media (max-width: 560px) {
  #zasoby { gap: 4px; max-width: 58vw; }
  .zasob { padding: 4px 8px 4px 6px; font-size: 13px; gap: 3px; }
  .zasob .ikona { font-size: 14px; }
  .planeta { padding: 5px 9px; }
  .planeta b { font-size: 13px; }
  .ikonki button { width: 38px; height: 38px; font-size: 17px; }
}

/* Kto poprosił system o mniej ruchu, ten dostaje mniej ruchu.
   Przycisk nadal się wyróżnia — kolorem, nie pulsowaniem. */
@media (prefers-reduced-motion: reduce) {
  #przycisk-kup { animation: none; }
  .zasob, #zycie-pasek, .ikonki button { transition: none; }
}

</style>
</head>
<body>

<canvas id="plotno"></canvas>

<!-- HUD: wszystko, co leży NA grze. Domyślnie przepuszcza kliknięcia
     (pointer-events: none), a łapią je tylko konkretne przyciski. -->
<div class="hud">

  <div class="gora-lewo">
    <div id="zasoby"></div>
  </div>

  <div class="gora-prawo">
    <div class="planeta">
      <b id="nazwa-planety">—</b>
      <span id="postep-kafli">0/0</span>
    </div>
    <div class="ikonki">
      <button type="button" id="przycisk-sklep" title="Ulepszenia">🛠️</button>
      <button type="button" id="przycisk-dzwiek" title="Dźwięk">🔊</button>
      <button type="button" id="przycisk-reset" title="Zacznij od nowa">♻️</button>
    </div>
  </div>

  <div id="podpowiedz"></div>

  <div class="dol-lewo">
    <div class="zycie"><div id="zycie-pasek"></div></div>
  </div>

  <button type="button" id="przycisk-kup" hidden></button>

  <!-- Gałka pojawia się tylko na ekranach dotykowych (patrz style.css) -->
  <div id="dzojstik"><div id="galka"></div></div>

  <div id="sklep" hidden>
    <h2>🛠️ Ulepszenia <button type="button" id="zamknij-sklep" title="Zamknij">✕</button></h2>
    <div id="lista-ulepszen"></div>
    <p class="sklep-stopka">Mocniejsze narzędzie = szybsze kopanie.<br>Kilof poz. 2 otwiera złoto, poz. 3 — kryształy.</p>
  </div>
</div>

<div id="ekran" hidden>
  <div class="okno">
    <h1></h1>
    <p></p>
    <div id="wybor-trudnosci" hidden></div>
    <!-- id, nie querySelector('button'): od kiedy nad spodem okna stoi wybór
         trudności, "pierwszy przycisk w oknie" to już nie ten przycisk. -->
    <button type="button" id="ekran-dalej"></button>
    <small>WSAD / strzałki — chodzenie &nbsp;•&nbsp; Spacja — odblokuj ziemię</small>
  </div>
</div>

<!-- Kolejność ma znaczenie: gra.js na końcu, bo od razu się uruchamia
     i potrzebuje wszystkich pozostałych plików już wczytanych. -->
<script>
/* ---------- js/ustawienia.js ---------- */
/* ============================================================
   USTAWIENIA — TU SIĘ BAWISZ
   ============================================================
   To jedyny plik, który musisz zrozumieć, żeby zmienić grę.
   Zmień liczbę, zapisz plik (Ctrl+S), odśwież grę w przeglądarce (F5).
   Coś się zepsuje? Wciśnij Ctrl+Z. Nic się nie stanie. Serio.

   Podpowiedź: gra pamięta postęp. Jeśli zmienisz coś dużego
   (np. rozmiar planety), kliknij "Od nowa" w grze.
   ============================================================ */

const USTAWIENIA = {

  // --- BOHATER -------------------------------------------------
  gracz: {
    predkosc: 230,      // px na sekundę. Ustaw 600 i zobacz, co się stanie :)
    promien: 15,        // jak duży jest ludzik
    maxZycie: 100,
    regenZycia: 4,      // ile życia wraca na sekundę...
    regenPo: 2.5,       // ...jeśli od tylu sekund nikt Cię nie uderzył
    zasiegKopania: 48,  // jak blisko trzeba stanąć, żeby kopać
    zasiegMiecza: 52,
  },

  // --- NARZĘDZIA ----------------------------------------------
  // obrazenia = bazowe + naPoziom * (poziom - 1)
  // tempo     = ile uderzeń na sekundę
  // bonusLupu = ile WIĘCEJ surowca leci z rozbicia za każdy poziom powyżej 1
  //
  // Ten `bonusLupu` to sedno rozwoju postaci. Kiedyś lepsze narzędzie tylko
  // szybciej rozbijało — czyli postęp był niewidoczny, bo licznik surowców
  // rósł tak samo. Teraz mocniejszy kilof sypie realnie większą kupą kamienia
  // i widać to gołym okiem po jednym uderzeniu.
  narzedzia: {
    siekiera: { nazwa: 'Siekiera', ikona: '🪓', bazowe: 7,  naPoziom: 3, tempo: 4.0, bonusLupu: 2, maxPoziom: 5 },
    kilof:    { nazwa: 'Kilof',    ikona: '⛏️', bazowe: 7,  naPoziom: 4, tempo: 3.6, bonusLupu: 2, maxPoziom: 5 },
    miecz:    { nazwa: 'Miecz',    ikona: '⚔️', bazowe: 12, naPoziom: 9, tempo: 2.6, bonusLupu: 0, maxPoziom: 5 },
  },

  // Cena ulepszenia narzędzia z poziomu `p` na `p+1`.
  // To jest FUNKCJA, nie liczba — dlatego ceny rosną same.
  cenaUlepszenia(poziom) {
    return {
      drewno: 20 * poziom,
      kamien: 14 * poziom,
      zloto: poziom >= 2 ? 6 * (poziom - 1) : 0,
    };
  },

  // --- ZASOBY --------------------------------------------------
  // Kolejność tutaj = kolejność pasków na górze ekranu.
  zasoby: {
    drewno:   { nazwa: 'Drewno',   ikona: '🪵', kolor: '#b5793a' },
    kamien:   { nazwa: 'Kamień',   ikona: '🪨', kolor: '#9aa3ad' },
    zloto:    { nazwa: 'Złoto',    ikona: '🪙', kolor: '#f2c14e' },
    krysztal: { nazwa: 'Kryształ', ikona: '💎', kolor: '#8f6ff5' },
  },

  // --- ZŁOŻA (to, co się rozwala) ------------------------------
  // narzedzie      – czym trzeba w to walić
  // minPoziom      – od jakiego poziomu narzędzia to działa (bramka progresji)
  // zycie          – ile obrażeń trzeba wbić
  // lupNaCios      – ile surowca leci przy KAŻDYM uderzeniu
  // lupZaRozbicie  – premia w momencie rozwalenia (rośnie z poziomem narzędzia)
  // odrasta        – po ilu sekundach złoże wraca
  //
  // `lupNaCios` jest tu najważniejszy i wcale nie chodzi o liczby. Wcześniej
  // surowiec leciał WYŁĄCZNIE przy rozbiciu, czyli nagroda przychodziła raz na
  // trzy sekundy, a pomiędzy nimi gracz stał i patrzył na malejący pasek.
  // Teraz coś dobrego dzieje się przy każdym machnięciu. To jest cała różnica
  // między "gra jest ospała" a "nie mogę przestać".
  //
  // Życie dobrane tak, żeby rozbicie brało ~4 ciosy na poziomie 1 i ~2 na 5 —
  // nigdy jednego, bo przy jednym ciosie znika rytm walenia.
  zloza: {
    drzewo: {
      nazwa: 'Drzewo', narzedzie: 'siekiera', minPoziom: 1,
      zasob: 'drewno', zycie: 28, lupNaCios: 1, lupZaRozbicie: 4, odrasta: 6, promien: 20,
    },
    skala: {
      nazwa: 'Skała', narzedzie: 'kilof', minPoziom: 1,
      zasob: 'kamien', zycie: 28, lupNaCios: 1, lupZaRozbicie: 4, odrasta: 7, promien: 22,
    },
    zyla: {
      nazwa: 'Żyła złota', narzedzie: 'kilof', minPoziom: 2,
      zasob: 'zloto', zycie: 48, lupNaCios: 1, lupZaRozbicie: 3, odrasta: 10, promien: 22,
    },
    krysztal: {
      nazwa: 'Kryształ', narzedzie: 'kilof', minPoziom: 3,
      zasob: 'krysztal', zycie: 60, lupNaCios: 1, lupZaRozbicie: 2, odrasta: 12, promien: 21,
    },
  },

  // --- POZIOM TRUDNOŚCI ---------------------------------------
  // Mnożniki nakładane na wrogów w chwili ich tworzenia. Wybór jest na
  // ekranie startowym, bo 5-latek i dorosły potrzebują innej gry — a jedna
  // wspólna wartość zawsze będzie dla kogoś nudna albo nie do przejścia.
  trudnosc: {
    latwy:    { nazwa: 'Łatwy',    ikona: '🙂', zycieWrogow: 0.6, obrazeniaWrogow: 0.4, predkoscWrogow: 0.8,  regenGracza: 2   },
    normalny: { nazwa: 'Normalny', ikona: '😐', zycieWrogow: 1,   obrazeniaWrogow: 1,   predkoscWrogow: 1,    regenGracza: 1   },
    trudny:   { nazwa: 'Trudny',   ikona: '😈', zycieWrogow: 1.6, obrazeniaWrogow: 1.8, predkoscWrogow: 1.25, regenGracza: 0.6 },
  },

  // --- WROGOWIE ------------------------------------------------
  // naPlanete = o ile mocniejszy robi się wróg z każdą kolejną planetą.

  // przeciwnicy. Teraz dogoni, jeśli będziesz stał i rąbał.
  szlam: {
    zycie: 55,
    predkosc: 115,
    obrazenia: 10,
    coIleBije: 1.0,      // sekundy między jego ciosami
    zasiegPogoni: 300,   // z jakiej odległości Cię zauważy

  // Boss śpi przy portalu i budzi się, gdy wykupisz całą planetę.
  // Dopóki żyje, portal nie działa. To jest kulminacja planety — bez niego

  boss: {
    zycie: 260,
    predkosc: 100,
    obrazenia: 18,
    coIleBije: 1.3,
    zasiegPogoni: 99999,  // raz obudzony, nie odpuszcza
    lupZloto: 40,
    odrasta: 0,           // 0 = nie wraca; bossa zabija się raz
    promien: 44,
    naPlanete: 0.55,
  },

  // --- PLANETY -------------------------------------------------
  // Chcesz szóstą planetę? Skopiuj jeden blok { ... } i zmień kolory.
  // Gra sama ją obsłuży — nie musisz ruszać nic więcej. Naprawdę.
  //
  // `siatka: 3` to 3x3 = 9 kafli, czyli 8 do kupienia. Wcześniej było 5x5,

  // Lepiej pięć krótkich planet niż trzy długie: nowa planeta to nowy kolor,

  planety: [
    {

      ziemia: ['#3f8f4d', '#378044'],  // dwa odcienie = szachownica
      obwodka: '#2c6537',

      obwodka: '#7a3a25',
      zloza: { drzewo: 4, skala: 5, zyla: 3, krysztal: 0 },

    },
    {

      siatka: 3,

    },
    {
      nazwa: 'Wulkaniczne Serce',
      siatka: 3,

      ziemia: ['#8c2f22', '#7a281d'],
